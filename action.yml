name: "Podcast Generator"
author: "This"
description: "generate a feed for podcast froma  yaml file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email: 
    description: the commiters's email address
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: the commiters name
    required: true
    default: ${{ github.actor}}